name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Unit and API tests
        run: pytest -q
      - name: Eval gate (rule baseline, offline)
        # Blocks the merge if high-risk recall regresses below the baseline.
        run: python -m evals.run_evals --min-high-recall 0.75
      - name: Dependency audit
        run: pip install pip-audit && pip-audit -r requirements.txt

  llm-eval:
    # Evaluates a real open-weights model, served by Ollama on the GitHub
    # runner's CPU. No API key, no cost (Actions is free for public repos).
    # Runs on main only. Scores go to Langfuse if its free-tier keys are set.
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LLM_PROVIDER: ollama
      OLLAMA_MODEL: qwen2.5:3b
      LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
      LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip, cache-dependency-path: requirements.txt }
      - run: pip install -r requirements.txt
      - name: Cache model
        uses: actions/cache@v4
        with:
          path: ~/.ollama/models
          key: ollama-${{ env.OLLAMA_MODEL }}
      - name: Start Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          (ollama serve > /tmp/ollama.log 2>&1 &)
          sleep 5
          ollama pull "$OLLAMA_MODEL"
      - name: Eval
        # Report-only until you've seen a few runs; then add --min-high-recall
        # at the level the model reliably hits, so regressions block merges.
        run: python -m evals.run_evals --out evals/results/llm.json | tee eval.txt
      - name: Job summary
        run: |
          echo '### LLM eval (${{ env.OLLAMA_MODEL }})' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"; cat eval.txt >> "$GITHUB_STEP_SUMMARY"; echo '```' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with: { name: llm-eval-results, path: evals/results/llm.json }

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t compliance-review-agent:ci .
